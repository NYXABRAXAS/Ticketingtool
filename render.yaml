# Render Blueprint for the LOS Ticketing Tool.
# Deploys the backend as a Node web service (bound to 0.0.0.0:$PORT) with a managed
# Postgres database, and the frontend as a static site. `sync: false` means the value
# must be entered once in the Render dashboard - it is never stored in this file or git.
#
# Backend + database are on Render's free plan so this deploys without a payment
# method on file. Tradeoffs: the free web service spins down after inactivity
# (~50s cold start on the next request) and the free Postgres database expires
# after 30-90 days unless upgraded. Bump `plan:` to `starter` below for production.
services:
  - type: web
    name: los-ticketing-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:migrate:deploy && npm run prisma:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # With NODE_ENV=production, npm install skips devDependencies by default - but
      # typescript/prisma/tsx/@types/* (needed to build and to run prisma:seed) live
      # there. This forces npm to install them anyway; it has no effect on the app's
      # own runtime behavior, which still reads NODE_ENV=production above.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000

      - key: DATABASE_URL
        fromDatabase:
          name: los-ticketing-db
          property: connectionString

      - key: REDMINE_BASE_URL
        sync: false
      - key: REDMINE_API_KEY
        sync: false
      - key: REDMINE_TIMEOUT
        value: "30000"
      - key: REDMINE_WEBHOOK_SECRET
        sync: false

      - key: TICKETING_JWT_SECRET
        generateValue: true
      - key: LAUNCH_TOKEN_SECRET
        generateValue: true

      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false

      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_POLL_INTERVAL_MS
        value: "60000"
      - key: LAUNCH_TOKEN_TTL_SECONDS
        value: "300"
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: MAX_UPLOAD_MB
        value: "15"

      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: los-ticketing-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: los-ticketing-db
    plan: free
